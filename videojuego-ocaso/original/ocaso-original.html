<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocaso del Imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: gran estrategia del ocaso de Roma, sobria, con peso y algo de drama
   IDEA: mesa de campaña de un general: mapa pixel art, estandartes, crónica de la corte
   PICTURE: el mapa ficticio (costas, bosques, colinas, ciudades) y el campo de batalla táctico
   COLOUR and TYPE: noche de piedra #12171c, oro imperial #f2c14e, colores propios de cada pueblo; Press Start 2P + Pixelify Sans
   LAYOUT: barra de recursos, mapa grande, panel de mando con pestañas; pantallas superpuestas para inicio, eventos y batalla */
:root{color-scheme:dark;--bg:#12171c;--panel:#1e262d;--edge:#3a4752;--ink:#ece5d2;--dim:#a2abb0;--gold:#f2c14e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 'Pixelify Sans',system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:12px max(3vw,12px);background:#0b0f12;border-bottom:4px solid #000}
h1{margin:0;font:400 clamp(26px,4vw,40px)/1 'Jacquard 12','Press Start 2P',monospace;color:var(--gold);text-shadow:3px 3px 0 #6a3d00}
#res{display:flex;gap:8px 18px;flex-wrap:wrap;font:12px/1.6 'Press Start 2P',monospace;align-items:center}
#res b{color:var(--gold);font-weight:400}#res small{color:#8fd18a;font-size:12px}#res small.neg{color:#ff7b6b}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px max(2.5vw,10px);max-width:1500px;margin:0 auto}
.board{background:#0a0d10;padding:8px;border:4px solid #000;box-shadow:inset 0 0 0 4px var(--edge),0 6px 0 #000;align-self:start}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
#mapwrap{overflow:auto;max-height:72vh;overscroll-behavior:contain}#map{aspect-ratio:512/320;cursor:pointer;max-width:none;touch-action:none}.zl{align-self:center;font:400 10px 'Press Start 2P',monospace;color:var(--dim);min-width:44px;text-align:center}#bscroll{overflow:auto;max-height:70vh;overscroll-behavior:contain}#bmap{aspect-ratio:800/480;cursor:crosshair;touch-action:none;max-width:none}.zb{min-height:36px;min-width:44px;padding:4px 10px;font-size:12px}
#hover{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 4px 2px;color:var(--dim);font-size:15px;min-height:32px}
aside{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--edge);padding:14px}
.card h2{margin:0 0 6px;font:400 14px/1.5 'Press Start 2P',monospace;text-wrap:balance}
.card h3{margin:14px 0 6px;font:400 12px/1.4 'Press Start 2P',monospace;color:var(--dim)}
.dim{color:var(--dim);margin:0 0 6px}p{margin:0 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabs button{font-size:9px;padding:6px 2px}
.troops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.troops div{background:#141a1f;border:2px solid #000;padding:6px 4px;text-align:center;font-size:14px;line-height:1.2}
.troops img{display:block;margin:0 auto 4px;width:34px;height:34px;image-rendering:pixelated}
.troops b{display:block;font:400 13px/1.4 'Press Start 2P',monospace}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
button{font:400 11px/1.5 'Press Start 2P',monospace;min-height:44px;padding:8px 6px;color:var(--ink);background:#33414c;border:3px solid #000;box-shadow:inset -3px -3px 0 #1c252c,inset 3px 3px 0 #52636f;cursor:pointer}
button small{display:block;color:var(--gold);font-size:9px;margin-top:3px}
button:hover:not(:disabled):not(.on):not(.gold):not(.red){background:#3e505d}button:active:not(:disabled){box-shadow:inset 3px 3px 0 #1c252c}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.on,button.gold{background:#8a6514;box-shadow:inset -3px -3px 0 #5a3f06,inset 3px 3px 0 #c4962e}
button.red,.end{background:#8b3222;box-shadow:inset -3px -3px 0 #561a10,inset 3px 3px 0 #b8503c}
.end{width:100%;font-size:13px}
select,input{font:16px 'Pixelify Sans',sans-serif;background:#141a1f;color:var(--ink);border:3px solid #000;min-height:44px;padding:6px 8px;width:100%}
.note{margin:8px 0 0;font-size:15px;color:var(--gold)}
.bar{height:10px;background:#0b0f12;border:2px solid #000}.bar i{display:block;height:100%}
.fac{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:15px;margin:5px 0}
.fac span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font:400 9px/1.6 'Press Start 2P',monospace;padding:1px 5px;border:2px solid #000;background:#2a343c;white-space:nowrap}
.tag.guerra{background:#7a2318}.tag.alianza{background:#22603a}.tag.tu{background:#7a5a12}
.row{border-top:2px solid #10151a;padding:10px 0}.row:first-of-type{border-top:0}
.row .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.btns button{min-height:38px;font-size:9px;padding:6px 7px}
.stats{font-size:14px;color:var(--dim)}
#log{max-height:420px;overflow:auto;font-size:15px;margin:0;padding:0;list-style:none}
#log li{margin:0 0 6px;padding-left:8px;border-left:3px solid var(--edge)}
#log li.good{border-color:#4caf50}#log li.bad{border-color:#e0503f}#log li.turn{border:0;padding:0;color:var(--gold);font-family:'Press Start 2P',monospace;font-size:10px;margin-top:10px}
.over{position:fixed;inset:0;background:rgba(5,8,10,.82);display:none;place-items:center;padding:14px;z-index:5;overflow:auto}
.over.show{display:grid}
#modal{z-index:9}#modalc{max-width:560px;width:100%}.mbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.mbtn button{flex:1 1 140px}
#start{background:#1b1430;place-items:center}#start .card:has(.hero){max-width:560px;background:rgba(36,24,18,.86)}#start .hero{grid-template-columns:minmax(0,1fr)}#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#start .card{position:relative;z-index:1;max-width:1000px;width:100%;background:rgba(36,24,18,.94);border:4px solid #000;box-shadow:inset 0 0 0 3px #b8862b,inset 0 0 0 7px #3b2716,0 8px 0 #000}
#start .card h2{font:400 clamp(30px,6vw,64px)/1 'Jacquard 12','Press Start 2P',monospace;color:var(--gold);text-shadow:4px 4px 0 #5a2c00;margin-bottom:10px}
#start .civ b{font:400 22px/1.1 'Jacquard 12',monospace;color:var(--gold)}
#start button{background:#5a3a1c;box-shadow:inset -3px -3px 0 #2f1d0c,inset 3px 3px 0 #8a6236}#start button.gold,#start button.on{background:#8a6514;box-shadow:inset -3px -3px 0 #5a3f06,inset 3px 3px 0 #d8a83e}
.music{min-height:40px;font-size:10px}
.civs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.civ{text-align:left;padding:12px;min-height:150px;font:15px/1.35 'Pixelify Sans',sans-serif;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.civ b{font:400 11px/1.5 'Press Start 2P',monospace}.civ i{display:block;width:100%;height:8px;border:2px solid #000}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
.hero h2{font-size:clamp(18px,3vw,30px);line-height:1.2;color:var(--gold)}
.hero canvas{border:4px solid #000}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;width:min(1400px,100%);align-items:start}
.bmain{background:#0a0d10;padding:6px;border:4px solid #000;box-shadow:inset 0 0 0 4px var(--edge)}
.bside{max-height:calc(100vh - 40px);overflow:auto}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px;align-items:center;margin:6px 0}
.slot>span{font:400 9px/1.4 'Press Start 2P',monospace;color:var(--dim)}
.slot .btns{margin:0}.slot .btns button{flex:1 1 auto}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}.ulist button{width:100%;text-align:left;font:15px/1.3 'Pixelify Sans',sans-serif;margin-bottom:5px;min-height:40px}
.ulist button.on{color:#fff}
#blog{font-size:14px;max-height:170px;overflow:auto;margin:8px 0 0;padding:0;list-style:none}#blog li{margin-bottom:4px;border-left:3px solid var(--edge);padding-left:6px}
@media(max-width:1000px){.wrap,.bwrap{grid-template-columns:minmax(0,1fr)}.bside{max-height:none}
 .board,.bmain{position:sticky;top:0;z-index:3}#mapwrap{max-height:46vh}.board{padding:4px;border-width:3px}#hover{padding:4px 2px 0;font-size:13px;min-height:24px}
 .end{position:sticky;bottom:0;z-index:4;box-shadow:0 -6px 0 var(--bg),inset -3px -3px 0 #561a10,inset 3px 3px 0 #b8503c}
 #battle{padding:0;place-items:start stretch}#bscroll{max-height:52vh}#battle .bwrap{gap:0}.bmain{padding:3px;border-width:3px}}
@media(max-width:640px){header{padding:8px 10px;gap:6px 12px}h1{font-size:14px}.hero{grid-template-columns:minmax(0,1fr)}#res{font-size:9px;gap:4px 12px}#res small{font-size:9px}
 .wrap{padding:0 0 10px;gap:8px}aside{padding:0 8px}.card{padding:12px}.civs{grid-template-columns:minmax(0,1fr)}.civ{min-height:0}
 .over{padding:8px}#start{place-items:start center}.slot{grid-template-columns:minmax(0,1fr)}.tabs button{font-size:8px}
 .fac{grid-template-columns:88px minmax(0,1fr) 50px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

function gen(seed){
 for(let tries=0;tries<300;tries++,seed++){
  const r=mul(seed),n1=noise(r,5,4),n2=noise(r,8,6),n3=noise(r,10,7),n4=noise(r,10,7),terr=[],grid=[];
  for(let y=0;y<H;y++){terr.push([]);grid.push([]);for(let x=0;x<W;x++){
   const dx=(x+.5-W/2)/(W/2),dy=(y+.5-H/2)/(H/2),d=dx*dx+dy*dy+(n1(x/W*5,y/H*4)-.5)*.7,m=n2(x/W*8,y/H*6);
   terr[y].push(d<.84?(m>.68?3:m>.55?2:1):0);grid[y].push(-1)}}
  const pts=[];
  for(let gy=0;gy<5;gy++)for(let gx=0;gx<8;gx++)for(let k=0;k<14;k++){const x=Math.floor((gx+.15+r()*.7)*W/8),y=Math.floor((gy+.15+r()*.7)*H/5);if(terr[y][x]){pts.push({x,y});break}}
  if(pts.length<34)continue;

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!terr[y][x])continue;const jx=x+(n3(x/W*10,y/H*7)-.5)*5,jy=y+(n4(x/W*10,y/H*7)-.5)*5;let b=0,bd=1e9;
   pts.forEach((p,i)=>{const dd=(p.x-jx)**2+(p.y-jy)**2;if(dd<bd){bd=dd;b=i}});grid[y][x]=b;cnt[b]++;sx[b]+=x;sy[b]+=y}

  const seen=new Set([0]),q=[0];while(q.length){const c=q.pop();adj[c].forEach(b=>{if(!seen.has(b)){seen.add(b);q.push(b)}})}

/* ---------- partida ---------- */

function newGame(me,cand){

 G.P=MAP.pts.map((p,i)=>({id:i,name:nm[i],x:p.cx,y:p.cy,owner:REB,cap:false,home:REB,u:{i:ri(2,4),a:ri(0,2),c:0},farm:0,market:0,walls:0,temple:0,tax:1,order:55,tired:false,gen:null,recent:0}));
 const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),caps=[G.P.reduce((b,p)=>p.x<b.x?p:b)];
 while(caps.length<7){const md=p=>Math.min(...caps.map(c=>dist(c,p)));caps.push(G.P.filter(p=>!caps.includes(p)).reduce((b,p)=>md(p)>md(b)?p:b))}
 caps.sort((a,b)=>a.x-b.x);
 for(let f=0;f<NF;f++){G.rel.push(Array(NF).fill(0));G.st.push(Array(NF).fill('paz'))}
 [5,2,0,4,3,1,6].forEach((f,i)=>setup(f,caps[i],f===me?cand:null));
 for(let f=0;f<NF;f++){const ex=MAP.adj[G.F[f].capId].map(i=>G.P[i]).filter(q=>q.owner===REB).slice(0,f<2?3:2);ex.forEach(q=>{q.owner=f;q.home=f;q.order=65;q.u={i:3,a:1,c:0}})}
 for(let a=0;a<NF;a++)for(let b=a+1;b<NF;b++){const v=(CIV[a].rel===CIV[b].rel?12:0)+ri(-10,10);G.rel[a][b]=G.rel[b][a]=v}
 const set=(a,b,s,v)=>{G.st[a][b]=G.st[b][a]=s;G.rel[a][b]=G.rel[b][a]=v};
 set(0,1,'alianza',50);set(3,1,'guerra',-40);set(3,0,'paz',-25);set(2,0,'paz',-20);set(6,1,'guerra',-35);set(4,0,'paz',-15);

function setup(f,p,cand){

/* ---------- economía ---------- */
function yields(p){const r=G.F[p.owner]?ruler(p.owner):null,gm=r?1+(r.ge-5)*.03:1;

/* ---------- IA ---------- */

 for(let g=0;F.gold>=10&&bord.length&&g<40;g++){const ee=inc(f);if(ee.net<0&&F.food+ee.net*3<0)break;
  const p=bord[g%Math.min(2,bord.length)],mix={i:0,a:0,c:0};hostile(p,f).forEach(q=>add(mix,q.u));
  let t=tot(mix)?{i:'a',a:'c',c:'i'}[TYP.slice().sort((a,b)=>mix[b]-mix[a])[0]]:'i';if(R()<.3)t=pick(TYP);
  if(cost(f,t)>F.gold||(t==='c'&&ee.net<2))t='i';if(cost(f,t)>F.gold)break;p.u[t]++;F.gold-=cost(f,t)}
 for(const p of own){if(G.over)return;if(p.owner!==f||p.tired||pw(p.u)<10)continue;const hs=hostile(p,f);
  if(!foes(p,f).length){const n=MAP.adj[p.id].map(i=>G.P[i]).filter(q=>q.owner===f).sort((a,b)=>foes(b,f).length-foes(a,f).length)[0];if(n&&foes(n,f).length)await march(p.id,n.id,1,true);continue}
  if(!hs.length)continue;const my=pw(p.u)*gb(p.gen);
  const tg=hs.map(q=>({q,s:my/(pw(q.u)*(1+.25*q.walls)*gb(q.gen)+3)*(q.owner===REB?1.15:1)*(q.cap?1.2:1)})).sort((a,b)=>b.s-a.s)[0];
  if(tg.s>1.45)await march(p.id,tg.q.id,foes(p,f).length>1?.8:1,true)}}

/* ---------- movimiento y combate de campaña ---------- */
async function march(from,to,frac,fast){
 const p=G.P[from],q=G.P[to],s={};for(const t in p.u)s[t]=frac>=1?p.u[t]:Math.floor(p.u[t]*frac);if(!tot(s))return;
 for(const t in s)p.u[t]-=s[t];let g=null;if(frac>=1&&p.gen!=null){g=p.gen;p.gen=null}
 await new Promise(res=>{anim={f:p.owner,x0:p.x*T+4,y0:p.y*T+4,x1:q.x*T+4,y1:q.y*T+4,t0:performance.now(),dur:reduce?1:fast?110:480,res}});
 await settle(p,q,s,g)}
function autoBattle(fa,fd,A,D,fort,gA,gD){A={...A};D={...D};
 const hp=(f,t)=>UN[t].hp*CIV[f].bon[t].hp;
 const dmg=(X,Y,fx,k)=>{const ty=tot(Y);if(!ty)return 0;let s=0;for(const t in X)for(const u in Y)s+=X[t]*UN[t].atk*CIV[fx].bon[t].atk*MULT[t][u]*Y[u]/ty;return s*.5*k*(.85+R()*.3)};
 const kl=(X,fx,d)=>{const ht=TYP.reduce((s,t)=>s+X[t]*hp(fx,t),0);if(!ht)return;for(const t of TYP){const k=d*(X[t]*hp(fx,t)/ht)/hp(fx,t),l=Math.floor(k)+(R()<k%1?1:0);X[t]=Math.max(0,X[t]-l)}};
 for(let r=0;r<8&&tot(A)>0&&tot(D)>0;r++){const a=dmg(A,D,fa,gb(gA)),d=dmg(D,A,fd,gb(gD)*(1.1+.25*fort));kl(D,fd,a);kl(A,fa,d)}
 return{win:tot(D)===0&&tot(A)>0,A,D}}
const armyTxt=(f,u,g)=>`${CIV[f].s}: ${tot(u)} soldados${g!=null&&G.C[g]?' al mando de '+G.C[g].n:''}`;
async function settle(p,q,s,g){
 const f=p.owner;if(q.owner===f){add(q.u,s);q.tired=true;if(g!=null){if(q.gen==null)q.gen=g;else if(p.gen==null)p.gen=g}return}
 const old=q.owner,gD=q.gen,n0=tot(s),d0=tot(q.u);let res;
 if(isMe(f)&&d0>0){const ch=await modal(`Batalla por ${q.name}`,`<p>${armyTxt(f,s,g)}<br>contra ${armyTxt(old,q.u,gD)}${q.walls?', tras murallas de nivel '+q.walls:''}.</p><p class="dim">Fuerza estimada: ${Math.round(pw(s)*gb(g))} contra ${Math.round(pw(q.u)*gb(gD)*(1.1+.25*q.walls))}. En el campo, cada punto de tropa son ${SPU} soldados: ${tot(s)*SPU} contra ${tot(q.u)*SPU}.</p><p>¿Cómo quieres librarla?</p>`,[{t:'Por turnos · 3 acciones',v:'t3',cls:'gold'},{t:'Por turnos · 1 acción',v:'t1',cls:'gold'},{t:'Tiempo real',v:'rt',cls:'gold'},{t:'Resolución automática',v:'auto'}]);
  res=ch!=='auto'?await tactical(f,old,s,{...q.u},q.walls,g,gD,q.name,ch):autoBattle(f,old,s,q.u,q.walls,g,gD)}
 else res=autoBattle(f,old,s,q.u,q.walls,g,gD);
 const{win,A,D}=res;flash={x:q.x*T+4,y:q.y*T+4,t0:performance.now()};const cls=isMe(f)?'good':isMe(old)?'bad':'';
 if(win){if(gD!=null&&R()<.5)kill(G.C[gD],'cae defendiendo '+q.name);
  Object.assign(q,{owner:f,u:A,tired:true,recent:3,order:Math.min(q.order,45),tax:1,gen:g});if(q.walls)q.walls--;if(CIV[f].loot)G.F[f].gold+=CIV[f].loot;
  addLog(`${CIV[f].s} conquista ${q.name}${old!==REB?' a '+CIV[old].s:''}. Bajas: ${n0-tot(A)} propias, ${d0} enemigas.`,cls);
  if(q.cap&&old<REB&&q.home===old)addLog(`¡Cae la capital de ${CIV[old].s}!`,cls);
  if(old<REB&&!alive(old))addLog(`${CIV[old].n} desaparece de la historia.`,isMe(old)?'bad':'good')}
 else{q.u=D;add(p.u,A);p.tired=true;if(g!=null){if(!tot(A)&&R()<.5)kill(G.C[g],'muere en '+q.name);else if(p.gen==null)p.gen=g}
  addLog(`${CIV[f].s} fracasa en ${q.name}. Bajas: ${n0-tot(A)} propias, ${d0-tot(D)} enemigas.`,isMe(f)?'bad':isMe(old)?'good':'')}
 checkEnd()}

/* ---------- vida de la corte ---------- */
function life(){
 for(const c of G.C){if(!c.alive)continue;c.age++;let pd=c.age<5?.02:c.age<40?.008:c.age<55?.025:c.age<65?.06:.14;if(c.tr==='Enfermizo')pd*=2;
  if(R()<pd){kill(c,c.age<6?'muere en la infancia':'muere de causas naturales');continue}if(c.age===16&&isMe(c.f))addLog(`${c.n} alcanza la mayoría de edad.`)}
 for(const c of G.C.slice()){if(!c.alive||c.sex!=='f'||c.sp==null)continue;const h=G.C[c.sp];if(!h.alive||h.f!==c.f||c.age<16||c.age>42)continue;
  if(kidsOf(c).length<6&&R()<.26){const k=mkChar(c.f,R()<.5?'m':'f',0,h.id,c.id);if(isMe(c.f))addLog(`Nace ${k.n}, ${k.sex==='m'?'hijo':'hija'} de ${h.n} y ${c.n}.`,'good');autoHeir(c.f)}}
 for(let f=0;f<NF;f++){if(!alive(f))continue;autoHeir(f);if(human(f))continue;for(const c of family(f))if(c.sp==null&&c.age>=18&&c.age<=40&&R()<.2)marry(c,mkChar(f,c.sex==='m'?'f':'m',clamp(c.age+ri(-4,2),16,45)))}}

function relig(f,a,b){for(let g=0;g<NF;g++){if(g===f)continue;if(CIV[g].rel===a)relAdd(f,g,15);if(CIV[g].rel===b)relAdd(f,g,-15)}owned(f).forEach(p=>p.order=clamp(p.order+(CIV[f].rel===a?6:CIV[f].rel===b?-6:0),0,100))}

 {t:'Bagaudas en los caminos',d:c=>`Campesinos armados asaltan las villas de ${c.p.name}.`,o:[['Enviar a la guarnición (−2 infantería, +10 orden)',c=>{c.p.u.i=Math.max(0,c.p.u.i-2);c.p.order+=10}],['Comprar su silencio (−40 oro)',c=>{G.F[c.f].gold-=40}]]},
 {t:'Mercaderes de seda',d:()=>'Una caravana de Oriente ofrece oro a cambio de exenciones y privilegios en tus mercados.',o:[['Conceder privilegios (+70 oro, −8 orden en la capital)',c=>{G.F[c.f].gold+=70;capOf(c.f).order-=8}],['Rechazarlos (+5 orden en la capital)',c=>{capOf(c.f).order+=5}]]},
 {t:'Conjura en la corte',d:c=>`Nobles descontentos conspiran contra ${ruler(c.f).n}.`,o:[['Purgar a los conjurados (−10 orden, +1 intriga)',c=>{owned(c.f).forEach(p=>p.order-=10);ruler(c.f).in=Math.min(10,ruler(c.f).in+1)}],['Comprar lealtades (−50 oro)',c=>{G.F[c.f].gold-=50}],['Ignorarlos',c=>{if(R()<.4){const v=pick(family(c.f).filter(x=>x.id!==G.F[c.f].ruler));if(v)kill(v,'es asesinado por los conjurados')}}]]},
 {t:'Embajada huna',ok:f=>f!==3&&alive(3),d:()=>`Emisarios de ${ruler(3).n} exigen un tributo en oro "por la paz de tus fronteras".`,o:[['Pagar 60 oro (+25 relación)',c=>{G.F[c.f].gold-=60;relAdd(c.f,3,25)}],['Negarse (−25 relación)',c=>{relAdd(c.f,3,-25);if(G.st[3][c.f]!=='guerra'&&R()<.4)declareWar(3,c.f)}]]},
 {t:'Peste',d:c=>`Una peste se extiende por ${c.p.name}.`,o:[['Cuarentena (−30 oro)',c=>{G.F[c.f].gold-=30}],['Encomendarse a Dios',c=>{if(R()<.5){for(const t of TYP)c.p.u[t]=Math.floor(c.p.u[t]/2);addLog(`La peste diezma la guarnición de ${c.p.name}.`,'bad')}}]]},
 {t:'Mercenarios alanos',d:()=>'Una banda de jinetes alanos ofrece sus lanzas al mejor postor.',o:[['Contratarlos (−60 oro, +4 caballería)',c=>{G.F[c.f].gold-=60;capOf(c.f).u.c+=4}],['Rechazarlos',()=>{}]]},
 {t:'Juegos en el hipódromo',d:()=>'La plebe pide carreras y espectáculos.',o:[['Celebrar juegos (−40 oro, +10 orden)',c=>{G.F[c.f].gold-=40;owned(c.f).forEach(p=>p.order+=10)}],['Ahorrar el oro',()=>{}]]}];
async function runEvent(ev){const c={f:ME,p:pick(owned(ME))};
 await modal(ev.t,`<p>${ev.d(c)}</p>`,ev.o.map(([t,fn])=>({t,fn:()=>{fn(c);owned(ME).forEach(p=>p.order=clamp(p.order,0,100))}})))}
async function inboxItem(it){const g=it.from;if(!alive(g)||!alive(ME))return;const rn=`${ttl(ruler(g))} ${ruler(g).n} de ${CIV[g].s}`;
 if(it.k==='peace'&&G.st[g][ME]==='guerra')await modal('Oferta de paz',`<p>${rn} ofrece la paz.</p>`,[{t:'Aceptar la paz',fn:()=>makePeace(ME,g),cls:'gold'},{t:'Rechazar',fn:()=>relAdd(ME,g,-5)}]);
 if(it.k==='ally'&&G.st[g][ME]==='paz')await modal('Propuesta de alianza',`<p>${rn} propone una alianza.</p>`,[{t:'Sellar la alianza',fn:()=>ally(ME,g),cls:'gold'},{t:'Rechazar',fn:()=>relAdd(ME,g,-5)}]);
 if(it.k==='marry'){const a=G.C[it.a],b=G.C[it.b];if(!a?.alive||!b?.alive||a.sp!=null||b.sp!=null||a.f!==g||b.f!==ME)return;
  await modal('Propuesta de matrimonio',`<p>${rn} propone casar a ${a.n} (${a.age}) con tu ${b.sex==='m'?'pariente':'parienta'} ${b.n} (${b.age}). ${a.n} vendría a vivir a tu corte.</p>`,[{t:'Aceptar la boda',fn:()=>marryAcross(b,a),cls:'gold'},{t:'Rechazar',fn:()=>relAdd(ME,g,-10)}])}}
async function startTurn(){if(!G||G.over||!alive(ME)||G.evY[ME]===G.year)return;G.evY[ME]=G.year;
 const box=G.inbox[ME]||[];G.inbox[ME]=[];for(const it of box)await inboxItem(it);
 if(G.year>410&&R()<.45){const ev=pick(EVENTS.filter(e=>!e.ok||e.ok(ME)));if(ev)await runEvent(ev)}ui();save()}

/* ---------- turnos ---------- */
async function yearEnd(){
 for(let f=0;f<NF;f++)economy(f);drift();
 for(let f=0;f<NF;f++){if(G.over)break;if(!human(f)&&alive(f)){await ai(f);ui()}}
 life();G.year++;G.P.forEach(p=>p.tired=false);G.F.forEach(F=>{F.asn=0;F.dip={}});
 addLog(`Año ${G.year} d.C.`,'turn');checkEnd()}
async function endTurn(){if(busy||!G||G.over||!myTurn()||BT)return;busy=true;aim=0;ui();
 try{if(net.on)await endOnline();else await yearEnd()}finally{busy=false}
 ui();if(!net.on){save();await startTurn()}}
function checkEnd(){if(G.over)return;const need=Math.ceil(G.P.length*.6);
 for(const f of G.human)if(alive(f)&&owned(f).length>=need)G.over={win:f};
 if(!G.over&&G.human.every(f=>!alive(f)))G.over={win:-1};
 if(G.over||!alive(ME))showEnd()}
function showEnd(){const w=G.over?.win,mine=w===ME;
 modal(mine?'¡Victoria!':alive(ME)?'La partida termina':'Derrota',mine?`<p>En el año ${G.year} d.C., ${ruler(ME).n} domina ${owned(ME).length} de ${G.P.length} provincias. Tu dinastía escribe la historia.</p>`:w>=0&&w!==ME?`<p>${CIV[w].n} se impone sobre el mundo conocido.</p>`:`<p>${CIV[ME].n} ha caído en el año ${G.year} d.C.</p>`,[{t:'Volver al menú',fn:()=>openStart('home')}])}
function save(){if(net.on||!G)return;try{localStorage.setItem('ocaso-save',JSON.stringify({G,ME}))}catch(e){}}

 const F=G.F[ME],e=inc(ME);

 $('tinfo').textContent=turnTxt;

 return h+'<p class="note">Cada año la corte envejece, nacen hijos y alguno muere. Si cae tu soberano, reina tu heredero.</p>'}

function enterGame(id,f){leaveNet();net.on=true;net.id=id;ME=f;$('start').classList.remove('show');
 net.unsub=net.db.doc('partidas/'+id).onSnapshot(s=>{const d=s.data();if(!d)return;net.seats=d.seats||{};net.cur=d.current;names(Object.values(net.seats));
  if((d.ver||0)>net.ver){net.ver=d.ver;try{const g=JSON.parse(d.state);if(!MAP||MAP.seed!==g.seed){MAP=gen(g.seed);drawBase()}G=g;if(sel===null||!G.P[sel]){sel=G.F[ME].capId;centerOn(sel)}}catch(e){console.error(e)}}
  if(!G)return;G.human=Object.keys(net.seats).map(Number);ui();if(myTurn()&&!busy)startTurn()},e=>{modal('Conexión perdida','<p>La partida online dejó de responder. Vuelve al menú y entra de nuevo.</p>',[{t:'Menú',fn:()=>openStart('home')}])})}
async function endOnline(){
 const hs=Object.keys(net.seats).map(Number).filter(alive).sort((a,b)=>a-b);G.human=Object.keys(net.seats).map(Number);
 let cur=hs.find(f=>f>ME);if(cur===undefined){await yearEnd();cur=Object.keys(net.seats).map(Number).filter(alive).sort((a,b)=>a-b)[0]??ME}
 net.ver++;net.cur=cur;try{await net.db.doc('partidas/'+net.id).update({state:JSON.stringify(G),ver:net.ver,current:cur,year:G.year})}catch(e){modal('No se guardó el turno','<p>Revisa tu conexión y vuelve a pulsar «Terminar mi turno».</p>',[{t:'Vale'}]);net.ver--;net.cur=ME}}


/* ---------- escena del menú ---------- */
const scx=$('scene').getContext('2d');
function drawScene(now){const c=scx,t=now/1000;
 const sky=['#1b1430','#2a1c44','#46234f','#6f2c4f','#a23e48','#d0623e','#ef9a4a'];sky.forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,i*9,200,9)});
 for(let i=1;i<sky.length;i++){c.fillStyle=sky[i];for(let x=(i%2);x<200;x+=2)c.fillRect(x,i*9-1,1,1)}
 c.fillStyle='#ffd27a';c.beginPath();c.arc(150,58,11,0,7);c.fill();c.fillStyle='#fff0b8';c.fillRect(146,52,4,2);
 for(const[cx,cy,w,sp]of[[30,14,26,3],[110,22,34,2],[170,10,20,4]]){const x=((cx+t*sp)%240)-30;c.fillStyle='#f6b6a0';c.fillRect(x,cy,w,3);c.fillRect(x+4,cy-2,w-10,2);c.fillStyle='#c77c7c';c.fillRect(x+2,cy+3,w-4,1)}
 c.fillStyle='#3b2a4f';for(let x=0;x<200;x++){const h=58+Math.round(Math.sin(x/13)*6+Math.sin(x/5.3)*2);c.fillRect(x,h,1,112-h)}
 c.fillStyle='#2a3b2a';for(let x=0;x<200;x++){const h=74+Math.round(Math.sin(x/21+1)*5+Math.sin(x/7)*1.5);c.fillRect(x,h,1,112-h)}
 c.fillStyle='#355c2c';c.fillRect(0,92,200,20);c.fillStyle='#3f6e33';for(let x=0;x<200;x+=3)c.fillRect(x,92+(x*7%5),1,1);
 const CX=46,CY=46;c.fillStyle='#1d1626';c.fillRect(CX,CY+8,46,30);c.fillRect(CX-4,CY,10,38);c.fillRect(CX+40,CY,10,38);c.fillRect(CX+17,CY-8,12,46);
 c.fillStyle='#2b2236';for(let i=0;i<5;i++){c.fillRect(CX-4+i*2,CY-2,1,2);c.fillRect(CX+40+i*2,CY-2,1,2);c.fillRect(CX+17+i*3,CY-10,2,2)}for(let i=0;i<12;i++)c.fillRect(CX+i*4,CY+6,2,2);
 c.fillStyle='#f2c14e';[[CX,CY+10],[CX+44,CY+10],[CX+22,CY],[CX+10,CY+18],[CX+33,CY+18]].forEach(([x,y],i)=>{if((Math.floor(t*2+i)%7)!==0)c.fillRect(x,y,2,3)});
 c.fillStyle='#0d0a12';c.fillRect(CX+19,CY+28,8,10);
 [[CX+1,CY-12,0],[CX+45,CY-12,2],[CX+23,CY-20,1]].forEach(([x,y,f],i)=>{c.fillStyle='#0d0a12';c.fillRect(x,y,1,12);const w=Math.floor(t*4+i)%2;c.fillStyle=CIV[f].c;c.fillRect(x+1,y+w,5,3);c.fillRect(x+6,y+1-w+1,2,2)});
 const off=(t*8)%240;for(let k=0;k<14;k++){const x=Math.round(((k*13+off)%240)-30),f=k<9?0:3,y=96+(k%2)*3,fr=Math.floor(t*6+k)%2;sprF(c,MS[k%5===4?'c':k%3===2?'a':'i'][fr],x,y,PAL[f],false)}
 for(let k=0;k<3;k++){const x=Math.round(((k*60+off*1.2+100)%240)-30);c.fillStyle='#0d0a12';c.fillRect(x+2,94,1,8);c.fillStyle=CIV[[0,2,3][k]].c;c.fillRect(x+3,94+Math.floor(t*4+k)%2,4,3)}}

/* ---------- música chiptune ---------- */
const AU={ctx:null,want:true,cur:null,next:0,step:0,timer:null};try{AU.want=localStorage.getItem('ocaso-mus')!=='0'}catch(_){}
function musLabel(){const b=$('musb');if(b)b.textContent=AU.want?'♪':'♪̸';b&&b.setAttribute('aria-label',AU.want?'Silenciar música':'Activar música')}
function audioInit(){if(AU.ctx)return;try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.out=AU.ctx.createGain();AU.out.gain.value=.14;AU.out.connect(AU.ctx.destination);
 const b=AU.ctx.createBuffer(1,AU.ctx.sampleRate*.4,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
 const re=new Float32Array(32),im=new Float32Array(32);for(let n=1;n<32;n++)im[n]=2/(n*Math.PI)*Math.sin(n*Math.PI*.25);AU.pulse=AU.ctx.createPeriodicWave(re,im)}catch(e){AU.ctx=null}}
const mf=m=>440*2**((m-69)/12);
function tone(kind,m,t,dur,vol){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();if(kind==='pulse')o.setPeriodicWave(AU.pulse);else o.type=kind;o.frequency.value=mf(m);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+dur*.55);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.03)}
function hit(t,f,dur,vol){const s=AU.ctx.createBufferSource(),fl=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();s.buffer=AU.noise;fl.type=f>1500?'highpass':'lowpass';fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.out);s.start(t);s.stop(t+dur)}
const N=n=>({C:0,D:2,E:4,F:5,G:7,A:9,B:11})[n[0]]+(n[1]==='b'?-1:n[1]==='#'?1:0)+12*(+n[n.length-1]+1);
function song(bpm,lead,chords,drums){const ev=[];let st=0;for(const[n,l]of lead){if(n)ev.push({st,m:N(n),l});st+=l}return{bpm,ev,len:st,chords:chords.map(c=>c.map(N)),drums}}
const SONGS={
 camp:song(96,[['D4',4],['A4',4],['G4',2],['F4',2],['E4',4],['D4',12],[0,4],['F4',4],['G4',2],['A4',2],['C5',4],['A4',4],['G4',8],[0,8],
  ['A4',4],['D5',4],['C5',2],['B4',2],['A4',4],['G4',4],['A4',2],['G4',2],['F4',8],['E4',4],['F4',4],['G4',4],['E4',4],['D4',16],
  ['F4',2],['G4',2],['A4',4],['A4',2],['G4',2],['F4',4],['G4',4],['E4',8],[0,4],['C4',4],['D4',4],['E4',4],['F4',2],['E4',2],['D4',4],['C4',8],
  ['D4',4],['F4',4],['A4',6],['G4',2],['F4',4],['E4',4],['D4',8],['A3',4],['C4',4],['D4',16]],
  [['D3','A3','D4'],['D3','A3','F4'],['F3','C4','A4'],['C3','G3','E4'],['A2','E3','C4'],['G2','D3','B3'],['C3','G3','E4'],['D3','A3','F4'],
   ['D3','A3','F4'],['C3','G3','E4'],['A2','E3','C4'],['G2','D3','B3'],['F3','C4','A4'],['C3','G3','E4'],['G2','D3','B3'],['D3','A3','D4']],
  'k.....h.s.....h.'),
 battle:song(138,[['D5',2],['D5',2],['C5',2],['D5',2],['F5',4],['E5',4],['D5',4],['A4',4],['Bb4',4],['A4',4],['G4',2],['A4',2],['Bb4',2],['C5',2],['D5',4],['C5',4],['A4',12],[0,4],
  ['F5',4],['E5',4],['D5',4],['C5',4],['Bb4',4],['C5',4],['D5',8],['C5',2],['Bb4',2],['A4',2],['G4',2],['F4',4],['E4',4],['D4',12],['A4',2],['C5',2]],
  [['D3','A3','F4'],['D3','A3','F4'],['G2','D3','Bb3'],['A2','E3','C#4'],['F3','C4','A4'],['Bb2','F3','D4'],['A2','E3','C#4'],['D3','A3','D4']],
  'k.h.s.h.k.k.s.hh')};
function playStep(sg,i,t,s16){const bar=Math.floor(i/16),ch=sg.chords[bar%sg.chords.length],b=i%16;
 for(const e of sg.ev)if(e.st===i){tone('pulse',e.m,t,e.l*s16*.95,.55);tone('square',e.m+12,t+s16*.5,Math.min(e.l,2)*s16*.6,.06)}
 if(b%4===0)tone('triangle',ch[0]-12,t,s16*3.6,.9);if(b%4===2)tone('triangle',ch[1]-12,t,s16*1.6,.6);
 if(b%2===1)tone('square',ch[(b>>1)%3]+12,t,s16*.9,.05);
 const d=sg.drums[b];if(d==='k')hit(t,160,.16,.9);if(d==='s')hit(t,1800,.12,.35);if(d==='h')hit(t,6000,.04,.18)}
function music(name){if(AU.timer){clearInterval(AU.timer);AU.timer=null}AU.cur=name;if(!name||!AU.want||!AU.ctx)return;try{AU.ctx.resume()}catch(_){}
 const sg=SONGS[name],s16=60/sg.bpm/4;AU.step=0;AU.next=AU.ctx.currentTime+.08;
 AU.timer=setInterval(()=>{if(!AU.ctx)return;while(AU.next<AU.ctx.currentTime+.15){playStep(sg,AU.step,AU.next,s16);AU.next+=s16;AU.step=(AU.step+1)%sg.len}},30)}
document.addEventListener('pointerdown',()=>{if(AU.want&&!AU.ctx){audioInit();music(BT?'battle':'camp')}},{passive:true});
musLabel();

renderStart();

}
