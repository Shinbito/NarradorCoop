<header><h1>Ocaso del Imperio</h1><div id="res" aria-live="off"></div><span class="btns ifz-hb"><button data-act="ifzayuda" aria-label="¿Cómo se juega?" title="¿Cómo se juega? (tecla ?)">?</button><button data-act="ifzopc" aria-label="Opciones" title="Opciones: velocidad, repetición, música">⚙</button><button class="music" data-act="music" id="musb">♪</button><button data-act="menu">Menú</button></span></header>
<main class="wrap">
 <div class="board"><div id="mapwrap"><div id="mapcapas"><canvas id="maphd" aria-hidden="true"></canvas><canvas id="map" aria-label="Mapa de campaña"></canvas></div></div><canvas id="ifzmini" hidden aria-label="Minimapa: toca para mover la vista" width="128" height="80"></canvas><div id="hover"><span class="btns ifz-zoom"><button class="zb" data-act="zoom-out" aria-label="Alejar">−</button><span class="zl" id="mzl">100%</span><button class="zb" data-act="zoom-in" aria-label="Acercar">+</button><button class="zb" data-act="zoom-cap" aria-label="Ir a tu capital" title="Ir a tu capital">♛</button></span><span id="hv" aria-live="polite">Toca una provincia para verla</span><span id="tinfo"></span></div></div>
 <aside aria-label="Panel de mando">
  <div class="card ifz-tut" id="ifztut" hidden aria-live="polite"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Pestañas del panel de mando"></div>
  <div class="card" id="panel" role="tabpanel" tabindex="-1"></div>
  <button class="end" data-act="end" id="endb">Fin de la estación ▶</button>
  <details class="card ifz-pot" id="potd" open><summary><h2>Potencias</h2><span class="stats" id="potn"></span></summary><div id="facs"></div></details>
 </aside>
</main>
<div id="ifzrep" class="ifz-rep" hidden></div>
<div class="over show" id="start"><canvas id="scene" width="200" height="112" aria-hidden="true"></canvas><div class="card" id="startc"></div></div>
<div class="over" id="battle"><div class="bwrap"><div class="bmain"><div id="bscroll"><canvas id="bmap" aria-label="Campo de batalla"></canvas></div><div class="btns" style="margin:4px 0 0"><button class="zb" data-act="b-zoom:out" aria-label="Alejar">− Zoom</button><span class="zl" id="bzl">100%</span><button class="zb" data-act="b-zoom:in" aria-label="Acercar">Zoom +</button><button class="zb" id="atkb" data-act="b-atk" aria-label="Atacar cuerpo a cuerpo con la selección">⚔ Atacar</button><button class="zb" id="disb" data-act="b-dis" aria-label="Atacar a distancia con la selección" hidden><svg class="ico-arco" viewBox="0 0 10 10" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><g fill="#c8894a"><rect x="2" y="0" width="2" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="1" y="2" width="1" height="6"/><rect x="1" y="8" width="2" height="1"/><rect x="2" y="9" width="2" height="1"/></g><g fill="#e8e2d0"><rect x="3" y="1" width="1" height="8"/></g><g fill="#f2c14e"><rect x="4" y="4" width="5" height="1"/><rect x="8" y="3" width="1" height="3"/><rect x="7" y="2" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/></g></svg> A distancia</button><button class="zb" data-act="b-selall">Todas</button><span class="stats" style="align-self:center">Pellizca o usa la rueda para hacer zoom; arrastra el terreno para moverte</span></div></div><div class="card bside" id="bside"></div></div></div>
<div class="over" id="modal"><div class="card" id="modalc" role="dialog" aria-modal="true" aria-labelledby="modalt"></div></div>

<script>
/* sin zoom de página: el doble toque o el pellizco ampliaban todo el juego y quedaba así (el mapa y la
   batalla tienen su propio zoom). iOS Safari ignora user-scalable=no: se cortan sus gestos aquí. */
for (const t of ["gesturestart", "gesturechange"]) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", (e) => e.touches.length > 1 && !e.target.closest("canvas, #mapwrap, .b3d") && e.preventDefault(), { passive: false });
/* app instalable (PWA): solo por http(s) y fuera de la app nativa */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
