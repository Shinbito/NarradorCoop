<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocaso del Imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">

<header><h1>Ocaso del Imperio</h1><div id="res"></div><span class="btns" style="margin:0"><button class="music" data-act="music" id="musb">♪</button><button data-act="menu">Menú</button></span></header>
<div class="wrap">
 <div class="board"><div id="mapwrap"><canvas id="map" aria-label="Mapa de campaña"></canvas></div><div id="hover"><span class="btns" style="margin:0"><button class="zb" data-act="zoom-out" aria-label="Alejar">− Zoom</button><span class="zl" id="mzl">100%</span><button class="zb" data-act="zoom-in" aria-label="Acercar">Zoom +</button></span><span id="hv">Toca una provincia para verla</span><span id="tinfo"></span></div></div>
 <aside>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="panel"></div>
  <button class="end" data-act="end" id="endb">Fin del año ▶</button>
  <div class="card"><h2>Potencias</h2><div id="facs"></div></div>
 </aside>
</div>
<div class="over show" id="start"><canvas id="scene" width="200" height="112" aria-hidden="true"></canvas><div class="card" id="startc"></div></div>
<div class="over" id="battle"><div class="bwrap"><div class="bmain"><div id="bscroll"><canvas id="bmap" aria-label="Campo de batalla"></canvas></div><div class="btns" style="margin:4px 0 0"><button class="zb" data-act="b-zoom:out" aria-label="Alejar">− Zoom</button><span class="zl" id="bzl">100%</span><button class="zb" data-act="b-zoom:in" aria-label="Acercar">Zoom +</button><button class="zb" id="atkb" data-act="b-atk" aria-label="Atacar con la selección">⚔ Atacar</button><button class="zb" data-act="b-selall">Todas</button><span class="stats" style="align-self:center">Pellizca o usa la rueda para hacer zoom; arrastra el terreno para moverte</span></div></div><div class="card bside" id="bside"></div></div></div>
<div class="over" id="modal"><div class="card" id="modalc"></div></div>
