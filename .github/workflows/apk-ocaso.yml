name: APK Ocaso

# Compila la app de Android de "Ocaso del Imperio" (videojuego-ocaso/) y la publica en Releases.
on:
  push:
    paths:
      - "videojuego-ocaso/**"
      - ".github/workflows/apk-ocaso.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-ocaso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videojuego-ocaso/app-movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias de Capacitor
        run: npm install

      - name: Proyecto Android (copia el juego, plataforma e iconos)
        run: npm run android

      - name: Compilar APK
        working-directory: videojuego-ocaso/app-movil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ocaso.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ocaso-apk
          path: ocaso.apk

      - name: Publicar en Releases («Ocaso del Imperio (Android)»)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ocaso-android
          name: Ocaso del Imperio (Android)
          prerelease: true
          make_latest: false
          body: |
            APK de prueba de Ocaso del Imperio, compilado desde `${{ github.ref_name }}` (${{ github.sha }}).
            Descarga `ocaso.apk` en el móvil, permite instalar apps de origen desconocido y ábrelo.
          files: ocaso.apk
